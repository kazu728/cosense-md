[package]
name = "cosense-py"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "PyO3 binding for cosense-core (MarkItDown plugin backend)"

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
cosense-core = { path = "../crates/cosense-core" }
pyo3 = { version = "0.30", features = ["abi3-py310"] }
