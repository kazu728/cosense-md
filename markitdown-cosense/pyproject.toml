[build-system]
requires = ["maturin>=1.16,<2.0"]
build-backend = "maturin"

[project]
name = "markitdown-cosense"
dynamic = ["version"]
description = "A markitdown plugin for converting Cosense notation to Markdown"
readme = "README.md"
license = {text = "MIT"}
authors = [
    { name = "kazu728", email = "kazuki.matsuo.728@gmail.com" }
]
keywords = ["markitdown", "cosense", "markdown", "converter", "plugin"]
requires-python = ">=3.10"
dependencies = [
    "markitdown>=0.1.9",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://github.com/kazu728/cosense-md"
Repository = "https://github.com/kazu728/cosense-md"
Issues = "https://github.com/kazu728/cosense-md/issues"

[project.entry-points."markitdown.plugin"]
markitdown-cosense = "markitdown_cosense"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "pyright>=1.1.414",
    "maturin>=1.16,<2.0",
]

[tool.pyright]
include = ["python"]
pythonVersion = "3.10"
pythonPlatform = "All"

[tool.maturin]
# Mixed layout: the Python package (accepts/stream glue) lives in python/, and
# the compiled Rust core is placed at markitdown_cosense._core. All conversion
# logic is in the Rust core; the Python side is glue plus the compiled module.
# manifest-path defaults to the Cargo.toml beside this file (the cosense-py crate).
python-source = "python"
module-name = "markitdown_cosense._core"

[tool.uv]
# uv only rebuilds a local project when pyproject.toml changes by default; list
# the Rust sources too so `uv run pytest` never tests a stale compiled core.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "src/**/*.rs" },
    { file = "../Cargo.toml" },
    { file = "../Cargo.lock" },
    { file = "../crates/cosense-core/Cargo.toml" },
    { file = "../crates/cosense-core/src/**/*.rs" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# The Python package lives in python/ (Rust source occupies src/), so point ruff's
# first-party detection there — otherwise markitdown_cosense reads as third-party.
src = ["python"]

[tool.ruff.lint]
extend-select = [
    "I",   # isort
    "UP",  # pyupgrade
]
