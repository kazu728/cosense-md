[package]
name = "cosense-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "wasm-bindgen binding for cosense-core (web preview and Chrome extension)"

[lib]
crate-type = ["cdylib"]

[dependencies]
cosense-core = { path = "../cosense-core" }
# Must match the wasm-bindgen CLI version.
wasm-bindgen = "=0.2.130"
